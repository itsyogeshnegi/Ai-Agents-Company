version: '3.8'

networks:
  game_internal:
    driver: bridge
    internal: false
  ai_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local

services:
  frontend:
    image: nginx:stable-alpine
    container_name: ttt_frontend
    ports:
      - "80:80"
      - "5173:5173"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - game_internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttt_api
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:ttt_secure_pass@mongodb:27017/ttt_db?authSource=admin
      - OLLAMA_HOST=http://ai_engine:11434
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - game_internal
      - ai_network
    depends_on:
      mongodb:
        condition: service_healthy
      ai_engine:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: ttt_mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=ttt_secure_pass
    volumes:
      - mongodb_data:/data/db
    networks:
      - game_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ai_engine:
    image: ollama/ollama:latest
    container_name: ttt_ai_engine
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3