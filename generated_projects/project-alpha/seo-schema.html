<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>[Hotel Name] | Luxury Accommodation in [City, State/Country]</title>
    <meta name="title" content="[Hotel Name] | Luxury Accommodation in [City, State/Country]">
    <meta name="description" content="Experience unparalleled luxury at [Hotel Name] in [City]. Enjoy [Feature 1], [Feature 2], and world-class service. Book your stay today for the best rates.">
    <meta name="keywords" content="luxury hotel [City], boutique hotel [City], best hotels in [City], [Hotel Name] booking, accommodation [City]">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="author" content="[Hotel Name]">

    <!-- Canonical Link -->
    <link rel="canonical" href="https://www.yourhotelwebsite.com/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.yourhotelwebsite.com/">
    <meta property="og:title" content="[Hotel Name] | Luxury Accommodation in [City]">
    <meta property="og:description" content="Experience unparalleled luxury at [Hotel Name]. From spa treatments to gourmet dining, we provide the perfect escape in [City].">
    <meta property="og:image" content="https://www.yourhotelwebsite.com/images/og-hotel-preview.jpg">
    <meta property="og:site_name" content="[Hotel Name]">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.yourhotelwebsite.com/">
    <meta property="twitter:title" content="[Hotel Name] | Luxury Accommodation in [City]">
    <meta property="twitter:description" content="Experience unparalleled luxury at [Hotel Name]. Book your stay in the heart of [City] now.">
    <meta property="twitter:image" content="https://www.yourhotelwebsite.com/images/twitter-hotel-preview.jpg">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "[Hotel Name]",
      "description": "A luxury hotel located in the heart of [City], offering premium rooms, a full-service spa, and award-winning dining.",
      "url": "https://www.yourhotelwebsite.com/",
      "telephone": "+[Country Code] [Phone Number]",
      "email": "info@[yourhotelwebsite.com]",
      "priceRange": "$$ - $$$",
      "starRating": {
        "@type": "Rating",
        "ratingValue": "5"
      },
      "image": [
        "https://www.yourhotelwebsite.com/images/hotel-exterior.jpg",
        "https://www.yourhotelwebsite.com/images/luxury-room.jpg"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[Street Address]",
        "addressLocality": "[City]",
        "addressRegion": "[State/Province]",
        "postalCode": "[Zip Code]",
        "addressCountry": "[Country]"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "[Latitude, e.g., 40.7128]",
        "longitude": "[Longitude, e.g., -74.0060]"
      },
      "amenityFeature": [
        {
          "@type": "LocationFeatureSpecification",
          "name": "Free Wi-Fi",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Swimming Pool",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Fitness Center",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Room Service",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Airport Shuttle",
          "value": true
        }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "1250"
      },
      "checkinTime": "15:00",
      "checkoutTime": "11:00"
    }
    </script>
</head>
<body>
    <!-- Page Content Goes Here -->
</body>
</html>
